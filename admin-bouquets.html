<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Arnaverse | Manage Bouquets</title>

    <!-- Favicon - no favicon.ico request -->
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E"
    >

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            background: #fff8fb;
            color: #333;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        .page {
            min-height: 100vh;
            padding: 35px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        /* HEADER */

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .title-area h1 {
            margin: 0;
            color: #7f2447;
            font-family: "Playfair Display", serif;
            font-size: 38px;
        }

        .title-area p {
            margin: 7px 0 0;
            color: #777;
            font-size: 15px;
        }

        .add-btn {
            border: none;
            background: #a8325d;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 6px 15px rgba(168, 50, 93, 0.18);
            transition: 0.2s;
        }

        .add-btn:hover {
            background: #8f294f;
            transform: translateY(-1px);
        }

        /* STATS */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #f2dce5;
            box-shadow: 0 5px 18px rgba(90, 30, 50, 0.05);
        }

        .stat-label {
            color: #777;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #7f2447;
        }

        /* FILTER */

        .filter-box {
            background: white;
            border: 1px solid #f2dce5;
            border-radius: 15px;
            padding: 18px;
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-input,
        .category-select {
            width: 100%;
            border: 1px solid #e4cbd5;
            border-radius: 9px;
            padding: 12px 14px;
            outline: none;
            background: white;
            font-size: 14px;
        }

        .search-input:focus,
        .category-select:focus,
        .form-control:focus {
            border-color: #a8325d;
            box-shadow: 0 0 0 3px rgba(168, 50, 93, 0.08);
        }

        .search-wrapper {
            flex: 2;
        }

        .category-wrapper {
            flex: 1;
        }

        /* GRID */

        .bouquet-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .bouquet-card {
            background: white;
            border: 1px solid #f0dce5;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 7px 20px rgba(80, 20, 40, 0.06);
            transition: 0.2s;
        }

        .bouquet-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(80, 20, 40, 0.10);
        }

        .image-box {
            width: 100%;
            height: 230px;
            background: #fff1f6;
            position: relative;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-fallback {
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #a8325d;
            font-size: 15px;
            background: #fff1f6;
        }

        .image-fallback span {
            font-size: 42px;
            margin-bottom: 7px;
        }

        .stock-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .stock-ok {
            color: #16834b;
        }

        .stock-low {
            color: #c77800;
        }

        .stock-out {
            color: #c62828;
        }

        .card-content {
            padding: 18px;
        }

        .category-tag {
            display: inline-block;
            background: #fff0f5;
            color: #a8325d;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .bouquet-name {
            margin: 0;
            color: #7f2447;
            font-size: 19px;
            font-weight: 700;
        }

        .description {
            color: #777;
            font-size: 13px;
            line-height: 1.5;
            margin: 9px 0;
            min-height: 39px;
        }

        .details {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 12px;
        }

        .detail-tag {
            background: #f7f7f7;
            border-radius: 7px;
            padding: 5px 8px;
            font-size: 11px;
            color: #666;
        }

        .price-stock {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1e5e9;
            padding-top: 13px;
            margin-top: 8px;
        }

        .price {
            font-size: 20px;
            font-weight: 700;
            color: #a8325d;
        }

        .stock-text {
            font-size: 13px;
            color: #666;
        }

        .card-actions {
            display: flex;
            gap: 9px;
            margin-top: 14px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            padding: 9px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .edit-btn {
            background: #fff;
            border: 1px solid #a8325d;
            color: #a8325d;
        }

        .edit-btn:hover {
            background: #fff0f5;
        }

        .delete-btn {
            background: #fff1f1;
            border: 1px solid #e4aaaa;
            color: #c62828;
        }

        .delete-btn:hover {
            background: #ffe3e3;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            color: #777;
        }

        .empty-state h3 {
            color: #7f2447;
            margin-bottom: 7px;
        }

        /* MODAL */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 10, 20, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(760px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .modal-header {
            padding: 22px 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            color: #7f2447;
            font-family: "Playfair Display", serif;
        }

        .close-btn {
            border: none;
            background: #fff1f5;
            color: #a8325d;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        .modal-body {
            padding: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 7px;
        }

        .form-control {
            border: 1px solid #dfcbd3;
            border-radius: 9px;
            padding: 11px 12px;
            outline: none;
            font-size: 14px;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 95px;
        }

        .image-upload {
            border: 2px dashed #ddb7c6;
            border-radius: 12px;
            padding: 18px;
            background: #fff9fb;
        }

        .image-upload input {
            width: 100%;
        }

        .upload-note {
            color: #888;
            font-size: 12px;
            margin-top: 8px;
        }

        .image-preview {
            margin-top: 15px;
            display: none;
        }

        .image-preview img {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid #ead5dd;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        .cancel-btn,
        .save-btn {
            padding: 11px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .cancel-btn {
            border: 1px solid #ddd;
            background: white;
            color: #666;
        }

        .save-btn {
            border: none;
            background: #a8325d;
            color: white;
        }

        .save-btn:hover {
            background: #8f294f;
        }

        /* RESPONSIVE */

        @media (max-width: 1100px) {
            .bouquet-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {
            .page {
                padding: 20px;
            }

            .top-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .bouquet-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-box {
                flex-direction: column;
            }
        }

        @media (max-width: 560px) {
            .stats-grid,
            .bouquet-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .title-area h1 {
                font-size: 30px;
            }

            .page {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <div class="container">

        <!-- HEADER -->
        <div class="top-header">

            <div class="title-area">
                <h1>Manage Bouquets</h1>
                <p>Add, edit, delete and manage bouquet products.</p>
            </div>

            <button class="add-btn" onclick="openAddModal()">
                + Add Bouquet
            </button>

        </div>

        <!-- STATS -->
        <div class="stats-grid">

            <div class="stat-card">
                <div class="stat-label">Total Bouquets</div>
                <div class="stat-value" id="totalBouquets">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Stock</div>
                <div class="stat-value" id="totalStock">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Average Price</div>
                <div class="stat-value" id="averagePrice">₹0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Low Stock</div>
                <div class="stat-value" id="lowStock">0</div>
            </div>

        </div>

        <!-- SEARCH / FILTER -->
        <div class="filter-box">

            <div class="search-wrapper">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search bouquets..."
                >
            </div>

            <div class="category-wrapper">
                <select id="categoryFilter" class="category-select">
                    <option value="all">All Categories</option>
                    <option value="Birthday">Birthday</option>
                    <option value="Love & Romance">Love & Romance</option>
                    <option value="Anniversary">Anniversary</option>
                    <option value="Friendship">Friendship</option>
                    <option value="Wedding">Wedding</option>
                </select>
            </div>

        </div>

        <!-- BOUQUET GRID -->
        <div class="bouquet-grid" id="bouquetGrid"></div>

    </div>
</div>


<!-- MODAL -->
<div class="modal-overlay" id="bouquetModal">

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">Add Bouquet</h2>

            <button
                class="close-btn"
                onclick="closeModal()"
                type="button"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <form id="bouquetForm">

                <input type="hidden" id="bouquetId">

                <div class="form-grid">

                    <!-- NAME -->
                    <div class="form-group full">
                        <label class="form-label">
                            Bouquet Name
                        </label>

                        <input
                            type="text"
                            id="bouquetName"
                            class="form-control"
                            placeholder="Enter bouquet name"
                            required
                        >
                    </div>

                    <!-- PRICE -->
                    <div class="form-group">

                        <label class="form-label">
                            Price (₹)
                        </label>

                        <input
                            type="number"
                            id="bouquetPrice"
                            class="form-control"
                            min="0"
                            placeholder="450"
                            required
                        >

                    </div>

                    <!-- STOCK -->
                    <div class="form-group">

                        <label class="form-label">
                            Stock
                        </label>

                        <input
                            type="number"
                            id="bouquetStock"
                            class="form-control"
                            min="0"
                            placeholder="10"
                            required
                        >

                    </div>

                    <!-- CATEGORY -->
                    <div class="form-group">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            id="bouquetCategory"
                            class="form-control"
                            required
                        >
                            <option value="">Select Category</option>
                            <option value="Birthday">Birthday</option>
                            <option value="Love & Romance">Love & Romance</option>
                            <option value="Anniversary">Anniversary</option>
                            <option value="Friendship">Friendship</option>
                            <option value="Wedding">Wedding</option>
                        </select>

                    </div>

                    <!-- FLOWER -->
                    <div class="form-group">

                        <label class="form-label">
                            Flower Type
                        </label>

                        <input
                            type="text"
                            id="bouquetFlower"
                            class="form-control"
                            placeholder="Rose"
                        >

                    </div>

                    <!-- COLOR -->
                    <div class="form-group">

                        <label class="form-label">
                            Color
                        </label>

                        <input
                            type="text"
                            id="bouquetColor"
                            class="form-control"
                            placeholder="Red"
                        >

                    </div>

                    <!-- SIZE -->
                    <div class="form-group">

                        <label class="form-label">
                            Size
                        </label>

                        <select
                            id="bouquetSize"
                            class="form-control"
                        >
                            <option value="Small">Small</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Large">Large</option>
                        </select>

                    </div>

                    <!-- DESCRIPTION -->
                    <div class="form-group full">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            id="bouquetDescription"
                            class="form-control"
                            placeholder="Enter bouquet description"
                        ></textarea>

                    </div>

                    <!-- IMAGE -->
                    <div class="form-group full">

                        <label class="form-label">
                            Bouquet Image
                        </label>

                        <div class="image-upload">

                            <input
                                type="file"
                                id="bouquetImage"
                                accept="image/*"
                            >

                            <div class="upload-note">
                                Select a bouquet image. The image will be compressed
                                and saved directly, so filename spaces will not cause 404 errors.
                            </div>

                            <div
                                class="image-preview"
                                id="imagePreview"
                            >
                                <img
                                    id="previewImage"
                                    src=""
                                    alt="Image Preview"
                                >
                            </div>

                        </div>

                    </div>

                </div>

                <!-- FOOTER -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeModal()"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Bouquet
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script>
/* =========================================================
   ARNAVERSE - MANAGE BOUQUETS
========================================================= */

const STORAGE_KEY = "arnaverseBouquets";

const IMAGE_FOLDER = "assets/images/bouquets/";

let selectedImageData = "";
let oldImageData = "";


/* =========================================================
   DEFAULT BOUQUETS
========================================================= */

const defaultBouquets = [
    {
        id: "B001",
        name: "Red Rose Bouquet",
        description: "Beautiful red roses arranged in an elegant bouquet.",
        flower: "Rose",
        color: "Red",
        size: "Medium",
        price: 450,
        stock: 10,
        category: "Love & Romance",
        image: "red-rose-bouquet.jpeg"
    },

    {
        id: "B002",
        name: "Pink Tulip Bouquet",
        description: "Soft pink tulips perfect for special occasions.",
        flower: "Tulip",
        color: "Pink",
        size: "Medium",
        price: 550,
        stock: 8,
        category: "Birthday",
        image: "pink-tulip-bouquet.jpeg"
    },

    {
        id: "B003",
        name: "Sunflower Bouquet",
        description: "Bright sunflower bouquet to make every moment cheerful.",
        flower: "Sunflower",
        color: "Yellow",
        size: "Large",
        price: 500,
        stock: 12,
        category: "Friendship",
        image: "hero-bouquet.jpeg"
    },

    {
        id: "B004",
        name: "Mixed Flower Bouquet",
        description: "A colourful combination of beautiful fresh flowers.",
        flower: "Mixed",
        color: "Mixed",
        size: "Large",
        price: 650,
        stock: 6,
        category: "Birthday",
        image: "purple-mixed-bouquet.jpeg"
    },

    {
        id: "B005",
        name: "Purple Lily Bouquet",
        description: "Elegant purple lilies arranged beautifully.",
        flower: "Lily",
        color: "Purple",
        size: "Medium",
        price: 700,
        stock: 7,
        category: "Anniversary",
        image: "purple-lily-bouquet.jpeg"
    },

    {
        id: "B006",
        name: "Red & White Bouquet",
        description: "A beautiful red and white mixed flower bouquet.",
        flower: "Mixed",
        color: "Red & White",
        size: "Large",
        price: 750,
        stock: 5,
        category: "Anniversary",
        image: "mixed-red-white-bouquet.jpeg"
    },

    {
        id: "B007",
        name: "Wedding Bouquet",
        description: "Elegant bouquet specially designed for weddings.",
        flower: "Mixed",
        color: "White",
        size: "Large",
        price: 900,
        stock: 4,
        category: "Wedding",
        image: "wedding-bouquet.jpeg"
    },

    {
        id: "B008",
        name: "Red Twin Rose Bouquet",
        description: "Romantic twin rose arrangement for your special person.",
        flower: "Rose",
        color: "Red",
        size: "Medium",
        price: 600,
        stock: 8,
        category: "Love & Romance",
        image: "red-twin-rose-bouquet.jpeg"
    }
];


/* =========================================================
   LOAD BOUQUETS
========================================================= */

function loadBouquets() {

    try {

        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {

            const parsed = JSON.parse(saved);

            if (Array.isArray(parsed)) {
                return parsed;
            }
        }

    } catch (error) {

        console.error("Bouquet loading error:", error);

    }

    return [...defaultBouquets];
}


/* =========================================================
   SAVE BOUQUETS
========================================================= */

function saveBouquets(bouquets) {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(bouquets)
        );

        return true;

    } catch (error) {

        console.error("Storage error:", error);

        alert(
            "Image/data is too large for browser storage.\n\n" +
            "Please choose a smaller image and try again."
        );

        return false;
    }
}


/* =========================================================
   DEFAULT IMAGE MAPPING
========================================================= */

function getNameFallbackImage(name) {

    const value = String(name || "")
        .trim()
        .toLowerCase();

    if (value.includes("red rose") && value.includes("twin")) {
        return "./" + IMAGE_FOLDER + "red-twin-rose-bouquet.jpeg";
    }

    if (value.includes("red rose")) {
        return "./" + IMAGE_FOLDER + "red-rose-bouquet.jpeg";
    }

    if (value.includes("pink tulip")) {
        return "./" + IMAGE_FOLDER + "pink-tulip-bouquet.jpeg";
    }

    if (value.includes("sunflower")) {
        return "./" + IMAGE_FOLDER + "hero-bouquet.jpeg";
    }

    if (value.includes("mixed flower")) {
        return "./" + IMAGE_FOLDER + "purple-mixed-bouquet.jpeg";
    }

    if (value.includes("purple lily") || value.includes("lily")) {
        return "./" + IMAGE_FOLDER + "purple-lily-bouquet.jpeg";
    }

    if (value.includes("red") && value.includes("white")) {
        return "./" + IMAGE_FOLDER + "mixed-red-white-bouquet.jpeg";
    }

    if (value.includes("wedding")) {
        return "./" + IMAGE_FOLDER + "wedding-bouquet.jpeg";
    }

    return "./" + IMAGE_FOLDER + "hero-bouquet.jpeg";
}


/* =========================================================
   GET BOUQUET IMAGE
========================================================= */

function getBouquetImage(bouquet) {

    let image = String(bouquet?.image || "")
        .trim()
        .replace(/\\/g, "/");

    /*
        IMPORTANT:
        Uploaded images are saved as data URLs.
        They must be returned directly.
    */

    if (image.startsWith("data:image/")) {
        return image;
    }

    /* External image */
    if (/^https?:\/\//i.test(image)) {
        return image;
    }

    /*
        Fix old .jpg names.
    */
    image = image.replace(/\.jpg$/i, ".jpeg");

    /*
        If old broken filename contains spaces or %20,
        use bouquet-name fallback.
    */

    if (
        image.includes("%20") ||
        /\s/.test(image)
    ) {

        return getNameFallbackImage(
            bouquet?.name
        );
    }

    /*
        Full folder path
    */

    if (
        image.includes("assets/images/bouquets/")
    ) {

        if (image.startsWith("./")) {
            return image;
        }

        return "./" + image;
    }

    /*
        Normal image filename
    */

    if (
        /\.(jpeg|jpg|png|webp)$/i.test(image)
    ) {

        return "./" + IMAGE_FOLDER + image;
    }

    /*
        Name based fallback
    */

    return getNameFallbackImage(
        bouquet?.name
    );
}


/* =========================================================
   IMAGE ERROR HANDLER
========================================================= */

function handleImageError(img) {

    const name = img.dataset.name || "";

    const fallback = getNameFallbackImage(name);

    const current = img.getAttribute("src");

    /*
        Try fallback only once.
    */

    if (
        fallback &&
        current !== fallback &&
        !img.dataset.fallbackUsed
    ) {

        img.dataset.fallbackUsed = "true";
        img.src = fallback;

        return;
    }

    img.style.display = "none";

    const fallbackBox =
        img.parentElement.querySelector(".image-fallback");

    if (fallbackBox) {
        fallbackBox.style.display = "flex";
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   RENDER BOUQUETS
========================================================= */

function renderBouquets() {

    const grid =
        document.getElementById("bouquetGrid");

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    const category =
        document.getElementById("categoryFilter").value;

    const bouquets = loadBouquets();

    const filtered = bouquets.filter(
        bouquet => {

            const matchesSearch =
                !search ||
                String(bouquet.name || "")
                    .toLowerCase()
                    .includes(search) ||

                String(bouquet.flower || "")
                    .toLowerCase()
                    .includes(search) ||

                String(bouquet.color || "")
                    .toLowerCase()
                    .includes(search);

            const matchesCategory =
                category === "all" ||
                bouquet.category === category;

            return (
                matchesSearch &&
                matchesCategory
            );
        }
    );


    if (!filtered.length) {

        grid.innerHTML = `
            <div class="empty-state">
                <h3>No bouquets found</h3>
                <p>Try another search or category.</p>
            </div>
        `;

        updateStats(bouquets);

        return;
    }


    grid.innerHTML = filtered.map(
        bouquet => {

            const image =
                getBouquetImage(bouquet);

            const stock =
                Number(bouquet.stock) || 0;

            let stockClass = "stock-ok";

            if (stock === 0) {
                stockClass = "stock-out";
            } else if (stock <= 10) {
                stockClass = "stock-low";
            }

            let stockText =
                stock === 0
                    ? "Out of Stock"
                    : `${stock} in stock`;


            return `
                <div class="bouquet-card">

                    <div class="image-box">

                        <img
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(bouquet.name)}"
                            data-name="${escapeHtml(bouquet.name)}"
                            onerror="handleImageError(this)"
                        >

                        <div class="image-fallback">
                            <span>🌸</span>
                            Image unavailable
                        </div>

                        <div class="stock-badge ${stockClass}">
                            ${stockText}
                        </div>

                    </div>


                    <div class="card-content">

                        <div class="category-tag">
                            ${escapeHtml(bouquet.category || "General")}
                        </div>

                        <h3 class="bouquet-name">
                            ${escapeHtml(bouquet.name)}
                        </h3>

                        <p class="description">
                            ${escapeHtml(
                                bouquet.description ||
                                "Beautiful bouquet for every special occasion."
                            )}
                        </p>


                        <div class="details">

                            <span class="detail-tag">
                                ${escapeHtml(bouquet.flower || "Mixed")}
                            </span>

                            <span class="detail-tag">
                                ${escapeHtml(bouquet.color || "Mixed")}
                            </span>

                            <span class="detail-tag">
                                ${escapeHtml(bouquet.size || "Medium")}
                            </span>

                        </div>


                        <div class="price-stock">

                            <div class="price">
                                ₹${Number(bouquet.price || 0).toLocaleString("en-IN")}
                            </div>

                            <div class="stock-text">
                                Stock: ${stock}
                            </div>

                        </div>


                        <div class="card-actions">

                            <button
                                class="edit-btn"
                                onclick="editBouquet('${escapeHtml(bouquet.id)}')"
                            >
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteBouquet('${escapeHtml(bouquet.id)}')"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                </div>
            `;
        }
    ).join("");


    updateStats(bouquets);
}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats(bouquets) {

    const total =
        bouquets.length;

    const totalStock =
        bouquets.reduce(
            (sum, bouquet) =>
                sum + (Number(bouquet.stock) || 0),
            0
        );

    const totalPrice =
        bouquets.reduce(
            (sum, bouquet) =>
                sum + (Number(bouquet.price) || 0),
            0
        );

    const average =
        total
            ? Math.round(totalPrice / total)
            : 0;

    const lowStock =
        bouquets.filter(
            bouquet => {

                const stock =
                    Number(bouquet.stock) || 0;

                return stock > 0 && stock <= 10;
            }
        ).length;


    document.getElementById(
        "totalBouquets"
    ).textContent = total;


    document.getElementById(
        "totalStock"
    ).textContent = totalStock;


    document.getElementById(
        "averagePrice"
    ).textContent =
        "₹" +
        average.toLocaleString("en-IN");


    document.getElementById(
        "lowStock"
    ).textContent = lowStock;
}


/* =========================================================
   OPEN ADD MODAL
========================================================= */

function openAddModal() {

    selectedImageData = "";
    oldImageData = "";

    document.getElementById(
        "bouquetForm"
    ).reset();

    document.getElementById(
        "bouquetId"
    ).value = "";

    document.getElementById(
        "modalTitle"
    ).textContent = "Add Bouquet";

    document.getElementById(
        "imagePreview"
    ).style.display = "none";

    document.getElementById(
        "previewImage"
    ).src = "";

    document.getElementById(
        "bouquetModal"
    ).classList.add("show");
}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {

    document.getElementById(
        "bouquetModal"
    ).classList.remove("show");

    selectedImageData = "";
    oldImageData = "";
}


/* =========================================================
   EDIT BOUQUET
========================================================= */

function editBouquet(id) {

    const bouquets =
        loadBouquets();

    const bouquet =
        bouquets.find(
            item => String(item.id) === String(id)
        );

    if (!bouquet) {

        alert("Bouquet not found.");

        return;
    }


    selectedImageData = "";

    oldImageData =
        bouquet.image || "";


    document.getElementById(
        "modalTitle"
    ).textContent = "Edit Bouquet";


    document.getElementById(
        "bouquetId"
    ).value = bouquet.id;


    document.getElementById(
        "bouquetName"
    ).value = bouquet.name || "";


    document.getElementById(
        "bouquetPrice"
    ).value = bouquet.price || 0;


    document.getElementById(
        "bouquetStock"
    ).value = bouquet.stock || 0;


    document.getElementById(
        "bouquetCategory"
    ).value = bouquet.category || "";


    document.getElementById(
        "bouquetFlower"
    ).value = bouquet.flower || "";


    document.getElementById(
        "bouquetColor"
    ).value = bouquet.color || "";


    document.getElementById(
        "bouquetSize"
    ).value =
        bouquet.size || "Medium";


    document.getElementById(
        "bouquetDescription"
    ).value =
        bouquet.description || "";


    document.getElementById(
        "bouquetImage"
    ).value = "";


    updateImagePreview(
        getBouquetImage(bouquet)
    );


    document.getElementById(
        "bouquetModal"
    ).classList.add("show");
}


/* =========================================================
   DELETE BOUQUET
========================================================= */

function deleteBouquet(id) {

    const bouquets =
        loadBouquets();

    const bouquet =
        bouquets.find(
            item => String(item.id) === String(id)
        );

    if (!bouquet) {
        return;
    }


    const confirmed =
        confirm(
            `Are you sure you want to delete "${bouquet.name}"?`
        );


    if (!confirmed) {
        return;
    }


    const updated =
        bouquets.filter(
            item => String(item.id) !== String(id)
        );


    if (saveBouquets(updated)) {

        renderBouquets();

    }
}


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload = function(event) {

                const img =
                    new Image();


                img.onload = function() {

                    const maxSize = 800;

                    let width =
                        img.width;

                    let height =
                        img.height;


                    if (width > maxSize ||
                        height > maxSize) {

                        if (width > height) {

                            height =
                                Math.round(
                                    height *
                                    maxSize /
                                    width
                                );

                            width =
                                maxSize;

                        } else {

                            width =
                                Math.round(
                                    width *
                                    maxSize /
                                    height
                                );

                            height =
                                maxSize;
                        }
                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width = width;
                    canvas.height = height;


                    const ctx =
                        canvas.getContext("2d");


                    /*
                        White background so
                        transparent PNGs don't
                        become black when converted
                        to JPEG.
                    */

                    ctx.fillStyle = "#ffffff";

                    ctx.fillRect(
                        0,
                        0,
                        width,
                        height
                    );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    const dataUrl =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.72
                        );


                    resolve(dataUrl);
                };


                img.onerror =
                    () =>
                        reject(
                            new Error(
                                "Could not read image."
                            )
                        );


                img.src =
                    event.target.result;
            };


            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "Could not read selected file."
                        )
                    );


            reader.readAsDataURL(file);
        }
    );
}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function updateImagePreview(imageSource) {

    const preview =
        document.getElementById(
            "imagePreview"
        );

    const img =
        document.getElementById(
            "previewImage"
        );


    if (!imageSource) {

        preview.style.display = "none";

        img.src = "";

        return;
    }


    img.onload = function() {

        preview.style.display =
            "block";
    };


    img.onerror = function() {

        preview.style.display =
            "none";
    };


    img.src = imageSource;
}


/* =========================================================
   IMAGE FILE CHANGE
========================================================= */

document
    .getElementById("bouquetImage")
    .addEventListener(
        "change",
        async function() {

            const file =
                this.files[0];


            if (!file) {
                return;
            }


            if (!file.type.startsWith("image/")) {

                alert(
                    "Please select a valid image file."
                );

                this.value = "";

                return;
            }


            try {

                selectedImageData =
                    await compressImage(file);


                updateImagePreview(
                    selectedImageData
                );


            } catch (error) {

                console.error(
                    "Image upload error:",
                    error
                );


                alert(
                    "Could not process this image. Please choose another image."
                );

                this.value = "";

                selectedImageData = "";
            }

        }
    );


/* =========================================================
   FORM SUBMIT
========================================================= */

document
    .getElementById("bouquetForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const id =
                document.getElementById(
                    "bouquetId"
                ).value.trim();


            const name =
                document.getElementById(
                    "bouquetName"
                ).value.trim();


            const price =
                Number(
                    document.getElementById(
                        "bouquetPrice"
                    ).value
                );


            const stock =
                Number(
                    document.getElementById(
                        "bouquetStock"
                    ).value
                );


            const category =
                document.getElementById(
                    "bouquetCategory"
                ).value;


            const flower =
                document.getElementById(
                    "bouquetFlower"
                ).value.trim();


            const color =
                document.getElementById(
                    "bouquetColor"
                ).value.trim();


            const size =
                document.getElementById(
                    "bouquetSize"
                ).value;


            const description =
                document.getElementById(
                    "bouquetDescription"
                ).value.trim();


            if (!name) {

                alert(
                    "Please enter bouquet name."
                );

                return;
            }


            if (price < 0) {

                alert(
                    "Price cannot be negative."
                );

                return;
            }


            if (stock < 0) {

                alert(
                    "Stock cannot be negative."
                );

                return;
            }


            const bouquets =
                loadBouquets();


            /*
                FIND EXISTING BOUQUET
            */

            const existingIndex =
                id
                    ? bouquets.findIndex(
                        item =>
                            String(item.id) ===
                            String(id)
                    )
                    : -1;


            /*
                IMAGE LOGIC

                1. New uploaded image
                   = selectedImageData

                2. Edit without new image
                   = old image

                3. New bouquet without upload
                   = default image
            */

            let image = "";


            if (selectedImageData) {

                image =
                    selectedImageData;

            } else if (
                existingIndex !== -1
            ) {

                image =
                    oldImageData ||
                    bouquets[existingIndex].image ||
                    "";

            } else {

                const defaultImage =
                    getNameFallbackImage(name);


                const prefix =
                    "./" + IMAGE_FOLDER;


                if (
                    defaultImage.startsWith(prefix)
                ) {

                    image =
                        defaultImage.substring(
                            prefix.length
                        );

                } else {

                    image =
                        defaultImage;
                }
            }


            const bouquetData = {

                id:
                    id ||
                    "B" +
                    Date.now()
                        .toString()
                        .slice(-6),

                name,
                description,

                flower:
                    flower || "Mixed",

                color:
                    color || "Mixed",

                size:
                    size || "Medium",

                price,

                stock,

                category:
                    category || "Birthday",

                image
            };


            /*
                UPDATE
            */

            if (existingIndex !== -1) {

                bouquets[existingIndex] =
                    bouquetData;

            }

            /*
                ADD
            */

            else {

                bouquets.push(
                    bouquetData
                );
            }


            /*
                SAVE
            */

            if (
                saveBouquets(
                    bouquets
                )
            ) {

                closeModal();

                renderBouquets();

            }

        }
    );


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        renderBouquets
    );


/* =========================================================
   CATEGORY FILTER
========================================================= */

document
    .getElementById("categoryFilter")
    .addEventListener(
        "change",
        renderBouquets
    );


/* =========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

document
    .getElementById("bouquetModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeModal();

            }
        }
    );


/* =========================================================
   ESCAPE KEY CLOSE MODAL
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeModal();

        }
    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderBouquets();

    }
);

</script>
